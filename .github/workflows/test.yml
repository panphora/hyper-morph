name: test

on:
  # Manual only (2026-10-23). Running on every push reported failures from
  # work in progress; dispatch it when preparing a release or deploy:
  #   gh workflow run test.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run build && git diff --exit-code dist/
      - run: npm run test:chrome -- --fail-only
      - run: npm run test:node:coverage
      - run: node test/lib/ensure-full-coverage.js

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:firefox -- --fail-only
      - run: npm run test:webkit -- --fail-only
